services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CONTENT_DIR: /app/content
      DATA_DIR: /app/data
    volumes:
      - ./content:/app/content:ro
      - ./data:/app/data
    # No published ports: the only way in is the tunnel below.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
